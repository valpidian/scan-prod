<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Scan Pret{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
</head>
<body class="app-body">
  <div class="app-veil app-veil-a" aria-hidden="true"></div>
  <div class="app-veil app-veil-b" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="app-sidebar">
      {% include "layout/sidebar.html" %}
    </aside>
    <main class="app-main">
      <div class="app-main-surface">
        {% include "layout/topbar.html" %}
        <section class="workspace container-fluid py-4">
          {% include "partials/flash_messages.html" %}
          {% block content %}{% endblock %}
        </section>
      </div>
    </main>
  </div>
  {% include "layout/footer.html" %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block modals %}{% endblock %}
</body>
</html>
